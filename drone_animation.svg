<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <style>
      @keyframes flight-path {
        0% {
          transform: translateX(-100px) translateY(50px) rotate(0deg);
        }
        25% {
          transform: translateX(700px) translateY(20px) rotate(15deg);
        }
        50% {
          transform: translateX(900px) translateY(150px) rotate(30deg);
        }
        75% {
          transform: translateX(300px) translateY(250px) rotate(-15deg);
        }
        100% {
          transform: translateX(-100px) translateY(50px) rotate(0deg);
        }
      }

      @keyframes propeller-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .drone-group {
        animation: flight-path 10s infinite ease-in-out;
        transform-origin: center;
      }

      .propeller {
        animation: propeller-spin 0.5s infinite linear;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1000" height="400" fill="url(#skyGradient)"/>

  <!-- Flying drone group -->
  <g class="drone-group">
    <!-- Drone body from the SVG you provided -->
    <g transform="translate(500, 200)">
      <!-- Main body -->
      <ellipse cx="0" cy="0" rx="25" ry="35" fill="#2c3e50" opacity="0.9"/>
      
      <!-- Camera gimbal -->
      <circle cx="0" cy="15" r="8" fill="#e74c3c"/>
      
      <!-- Left arms -->
      <g>
        <!-- Left front motor -->
        <rect x="-50" y="-10" width="45" height="8" fill="#34495e" rx="4"/>
        <circle cx="-50" cy="-6" r="8" fill="#2c3e50"/>
        <circle cx="-50" cy="-6" r="5" fill="#bdc3c7"/>
        
        <!-- Left propeller -->
        <g class="propeller" transform="translate(-50, -6)">
          <ellipse rx="20" ry="4" fill="#3498db" opacity="0.7"/>
          <ellipse rx="4" ry="20" fill="#3498db" opacity="0.7"/>
        </g>
        
        <!-- Left rear motor -->
        <rect x="-50" y="2" width="45" height="8" fill="#34495e" rx="4"/>
        <circle cx="-50" cy="6" r="8" fill="#2c3e50"/>
        <circle cx="-50" cy="6" r="5" fill="#bdc3c7"/>
        
        <!-- Left rear propeller -->
        <g class="propeller" transform="translate(-50, 6)">
          <ellipse rx="20" ry="4" fill="#3498db" opacity="0.7"/>
          <ellipse rx="4" ry="20" fill="#3498db" opacity="0.7"/>
        </g>
      </g>

      <!-- Right arms -->
      <g>
        <!-- Right front motor -->
        <rect x="5" y="-10" width="45" height="8" fill="#34495e" rx="4"/>
        <circle cx="50" cy="-6" r="8" fill="#2c3e50"/>
        <circle cx="50" cy="-6" r="5" fill="#bdc3c7"/>
        
        <!-- Right propeller -->
        <g class="propeller" transform="translate(50, -6)">
          <ellipse rx="20" ry="4" fill="#e74c3c" opacity="0.7"/>
          <ellipse rx="4" ry="20" fill="#e74c3c" opacity="0.7"/>
        </g>
        
        <!-- Right rear motor -->
        <rect x="5" y="2" width="45" height="8" fill="#34495e" rx="4"/>
        <circle cx="50" cy="6" r="8" fill="#2c3e50"/>
        <circle cx="50" cy="6" r="5" fill="#bdc3c7"/>
        
        <!-- Right rear propeller -->
        <g class="propeller" transform="translate(50, 6)">
          <ellipse rx="20" ry="4" fill="#e74c3c" opacity="0.7"/>
          <ellipse rx="4" ry="20" fill="#e74c3c" opacity="0.7"/>
        </g>
      </g>

      <!-- Signal waves -->
      <g opacity="0.5">
        <circle cx="0" cy="0" r="30" fill="none" stroke="#3498db" stroke-width="1"/>
        <circle cx="0" cy="0" r="45" fill="none" stroke="#3498db" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- Trail effect -->
  <g opacity="0.3">
    <path d="M 0,50 Q 250,30 500,50" stroke="#3498db" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    <path d="M 500,50 Q 750,80 1000,120" stroke="#3498db" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  </g>
</svg>
