<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <style>
      @keyframes flight-path {
        0% {
          transform: translateX(-150px) translateY(80px) rotate(0deg) scaleX(1);
        }
        20% {
          transform: translateX(300px) translateY(20px) rotate(10deg) scaleX(1);
        }
        40% {
          transform: translateX(600px) translateY(40px) rotate(20deg) scaleX(1);
        }
        60% {
          transform: translateX(800px) translateY(100px) rotate(10deg) scaleX(1);
        }
        80% {
          transform: translateX(400px) translateY(150px) rotate(-10deg) scaleX(-1);
        }
        100% {
          transform: translateX(-150px) translateY(80px) rotate(0deg) scaleX(1);
        }
      }

      @keyframes propeller-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .drone-group {
        animation: flight-path 12s infinite ease-in-out;
        transform-origin: center;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
      }

      .propeller {
        animation: propeller-spin 0.4s infinite linear;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Flying drone group - NO BACKGROUND -->
  <g class="drone-group">
    <g transform="translate(500, 150)">
      <!-- Main body -->
      <ellipse cx="0" cy="0" rx="22" ry="32" fill="#2c3e50"/>
      
      <!-- Camera gimbal -->
      <circle cx="0" cy="12" r="7" fill="#e74c3c"/>
      <rect x="-10" y="12" width="20" height="8" fill="#c0392b" opacity="0.8"/>
      
      <!-- Left front arm -->
      <g>
        <rect x="-48" y="-12" width="42" height="7" fill="#34495e" rx="3.5"/>
        <circle cx="-48" cy="-8.5" r="7" fill="#2c3e50"/>
        <circle cx="-48" cy="-8.5" r="4" fill="#95a5a6"/>
        
        <!-- Left front propeller -->
        <g class="propeller" transform="translate(-48, -8.5)">
          <ellipse rx="18" ry="3" fill="#3498db" opacity="0.8"/>
          <ellipse rx="3" ry="18" fill="#3498db" opacity="0.8"/>
        </g>
      </g>

      <!-- Left rear arm -->
      <g>
        <rect x="-48" y="5" width="42" height="7" fill="#34495e" rx="3.5"/>
        <circle cx="-48" cy="8.5" r="7" fill="#2c3e50"/>
        <circle cx="-48" cy="8.5" r="4" fill="#95a5a6"/>
        
        <!-- Left rear propeller -->
        <g class="propeller" transform="translate(-48, 8.5)">
          <ellipse rx="18" ry="3" fill="#3498db" opacity="0.8"/>
          <ellipse rx="3" ry="18" fill="#3498db" opacity="0.8"/>
        </g>
      </g>

      <!-- Right front arm -->
      <g>
        <rect x="6" y="-12" width="42" height="7" fill="#34495e" rx="3.5"/>
        <circle cx="48" cy="-8.5" r="7" fill="#2c3e50"/>
        <circle cx="48" cy="-8.5" r="4" fill="#95a5a6"/>
        
        <!-- Right front propeller -->
        <g class="propeller" transform="translate(48, -8.5)">
          <ellipse rx="18" ry="3" fill="#e74c3c" opacity="0.8"/>
          <ellipse rx="3" ry="18" fill="#e74c3c" opacity="0.8"/>
        </g>
      </g>

      <!-- Right rear arm -->
      <g>
        <rect x="6" y="5" width="42" height="7" fill="#34495e" rx="3.5"/>
        <circle cx="48" cy="8.5" r="7" fill="#2c3e50"/>
        <circle cx="48" cy="8.5" r="4" fill="#95a5a6"/>
        
        <!-- Right rear propeller -->
        <g class="propeller" transform="translate(48, 8.5)">
          <ellipse rx="18" ry="3" fill="#e74c3c" opacity="0.8"/>
          <ellipse rx="3" ry="18" fill="#e74c3c" opacity="0.8"/>
        </g>
      </g>

      <!-- Antenna -->
      <rect x="-2" y="-35" width="4" height="10" fill="#7f8c8d"/>
      <circle cx="0" cy="-37" r="3" fill="#e74c3c" opacity="0.9"/>

      <!-- LED lights -->
      <circle cx="-45" cy="-15" r="2" fill="#2ecc71" opacity="0.9"/>
      <circle cx="45" cy="-15" r="2" fill="#e74c3c" opacity="0.9"/>
    </g>
  </g>
</svg>
